# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI/CD with GitHub Actions

on:
  push:
    branches: ["master", "dev"]
    paths:
      - "front/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Organization Repository  (only front/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: JobCatcher/recommend-lunch-menu # Organization의 원본 레포
          sparse-checkout: |
            front
          sparse-checkout-cone-mode: false

      - name: Configure Git for Syncing Fork
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Fork Repository as Remote
        run: |
          git remote add fork https://github.com/lecto17/recommend-lunch-menu.git
          git fetch fork

      - name: Sync Fork with Upstream (Organization Repository)
        run: |
          git checkout dev
          git merge --no-edit origin/dev
          git push fork dev

      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          repository: lecto17/recommend-lunch-menu # 개인적으로 fork한 레포
          ref: dev
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

