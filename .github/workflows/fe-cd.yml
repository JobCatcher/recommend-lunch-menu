# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI/CD with GitHub Actions

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: ["master", "dev"]
    paths:
      - "front/**"

jobs:
  setup_git:
    runs-on: ubuntu-latest # Ubuntu 환경에서 실행
    steps:
      - name: Set up Git credential helper for Ubuntu
        run: |
          git config --global credential.helper store
          git config --global credential.useHttpPath true

  build:
    needs: setup_git
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Organization Repository  (only front/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: JobCatcher/recommend-lunch-menu # Organization의 원본 레포
          sparse-checkout: |
            front

      - name: Configure Git for Syncing Fork
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Debug GitHub Token
        run: |
          echo "Checking if PAT is available..."
          echo "Token length: ${{secrets.PERSONAL_ACCESS_TOKEN}}"

      - name: Add Fork Repository as Remote
        run: |
          git remote rename origin upstream
          git remote add origin https://github.com/lecto17/recommend-lunch-menu.git
          git fetch origin
          git remote -v

      - name: Sync Fork with Upstream (Organization Repository)
        run: |
          git checkout dev
          git pull upstream dev --rebase
          git remote -v
          git push https://lecto17:${{ secrets.LATEST_PERSONAL_ACCESS_TOKEN }}@github.com/lecto17/cd-test.git main
        #  git push https://x-access-token:${{ secrets.LATEST_PERSONAL_ACCESS_TOKEN }}@github.com/lecto17/recommend-lunch-menu.git dev

      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          repository: lecto17/recommend-lunch-menu # 개인적으로 fork한 레포
          ref: dev
          token: ${{ secrets.LATEST_PERSONAL_ACCESS_TOKEN }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

